[project]
name = "explorai-pipelines"
version = "0.1.0"
description = "Explorai ingestion pipelines"
requires-python = ">=3.12"
dependencies = [
    "explorai-db",
    "pydantic-settings",
    "prefect",
    "httpx",
    "pymupdf",
    "trafilatura",
    "datasketch",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.uv.sources]
explorai-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explorai_pipelines"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=explorai_pipelines --cov-fail-under=80"
markers = [
    "integration: tests that need a real PostgreSQL (DATABASE_URL)",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["explorai_pipelines", "explorai_db"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["fitz", "pymupdf", "pymupdf.*", "trafilatura", "trafilatura.*", "datasketch", "datasketch.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
