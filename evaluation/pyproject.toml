[project]
name = "explorai-eval"
version = "0.1.0"
description = "Explorai evaluation: RAG quality metrics, Ragas integration, Langfuse tracing"
requires-python = ">=3.12"
dependencies = [
    "explorai-ai",
    "explorai-db",
    "ragas>=0.2,<0.3",
    "langfuse>=5.1.0,<6",
    "langchain-anthropic>=0.3,<0.4",
    "langchain-voyageai>=0.2,<0.3",
    "langchain>=0.3,<0.4",
    "datasets>=2,<4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
explorai-eval = "explorai_eval.measure:main"

[tool.uv.sources]
explorai-ai = { workspace = true }
explorai-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explorai_eval"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=explorai_eval --cov-fail-under=80"
testpaths = ["tests"]
markers = [
    "integration: tests that need real services (PostgreSQL, Qdrant, Langfuse, real API keys)",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["explorai_eval", "explorai_ai", "explorai_db"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
