# Local development dependencies. Run from the repo root:
#   docker compose --env-file infra/.env -f infra/docker-compose.yml up -d --wait
x-pipelines-build: &pipelines-build
  context: ..
  dockerfile: pipelines/Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Vector store for the RAG index. The official image has no curl or wget but has bash,
  # so the health check opens a TCP connection to the port with bash's /dev/tcp.
  qdrant:
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in infra/.env}
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    # Inside the Compose network the services are reached by name, not 127.0.0.1.
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CHECK_TIMEOUT_SECONDS: ${CHECK_TIMEOUT_SECONDS}
      BLOB_DIR: /data/blobs
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:5173}
      # The dev stack serves plain HTTP: a Secure cookie would not be usable by curl.
      # Production MUST set SESSION_COOKIE_SECURE=true (the application default).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20000000}
    volumes:
      - blobs:/data/blobs
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: applies the Alembic migrations, then exits 0.
  migrate:
    build: *pipelines-build
    image: explorai-pipelines:dev
    command: ["python", "-m", "explorai_db.migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Prefect server from the same image as the flows, so client and server versions
  # cannot drift. SQLite on a volume: development only.
  prefect:
    build: *pipelines-build
    image: explorai-pipelines:dev
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - prefect-data:/data/prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  pipelines:
    build: *pipelines-build
    image: explorai-pipelines:dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PREFECT_API_URL: http://prefect:4200/api
      CONTACT_EMAIL: ${CONTACT_EMAIL:-dev@example.invalid}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-50000000}
      EXTRACT_TIMEOUT_SECONDS: ${EXTRACT_TIMEOUT_SECONDS:-60}
      ARXIV_MIN_INTERVAL_SECONDS: ${ARXIV_MIN_INTERVAL_SECONDS:-3.0}
    volumes:
      - blobs:/data/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
      prefect:
        condition: service_healthy
    healthcheck:
      # The serving process is useless without the Prefect API, so check that.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://prefect:4200/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  blobs:
  prefect-data:
  qdrant-data:
