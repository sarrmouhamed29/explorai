version: 2
updates:
  - package-ecosystem: uv
    directories: ["/", "/backend"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-dev-dependencies:
        dependency-type: development
      frontend-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-images:
        patterns: ["*"]
